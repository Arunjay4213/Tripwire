# CI gate config -- a *defended* deployment, swept under attack in CI.
#
# This is what you point the ASR gate at (.github/workflows/asr-gate.yml): your
# shipped agent + the defense you actually deploy. A change that reopens the
# leak turns this sweep's ASR above threshold and fails the build.
#
# It intentionally uses `tool_filter`, which denies the sink: send_email is
# removed from the menu AND blocked mid-loop, while the scenario's read tool is
# kept, so the agent still reads the task and the injection. The gate is
# therefore *deterministic* -- ASR is 0 regardless of model sampling, no flaky
# reds from provider nondeterminism -- which also means it only proves the
# wiring works, not that the model resists injection. Swap in your own
# adapter and a content-inspecting defense (spotlighting, outbound_guard) to
# gate a configuration that still lets the agent send legitimate email; expect
# a non-zero, model-dependent ASR there and set the threshold accordingly.

models:
  - llama-3.3-70b-versatile

adapters:
  - raw_loop

attacks:
  # `--smoke` (used by the CI gate) runs only the first attack, so lead with a
  # strong one rather than the weak `direct` baseline.
  - fixed_injection
  - important_instructions
  - direct

defenses:
  - tool_filter

seeds: [0, 1, 2]

limits:
  max_turns: 5
  smoke: false
  campaign_budget: 8
