# CI gate config -- a *defended* deployment, swept under attack in CI.
#
# This is what you point the ASR gate at (.github/workflows/asr-gate.yml): your
# shipped agent + the defense you actually deploy. A change that reopens the
# leak turns this sweep's ASR above threshold and fails the build.
#
# It uses `recipient_allowlist`: a send_email to any address the user did not
# name in their request is blocked before it runs, deterministically. The agent
# still sends its legitimate email (utility intact), and every exfiltration in
# this harness is a send to an unapproved address, so ASR is 0 regardless of
# model sampling -- no flaky reds from provider nondeterminism. A change that
# drops or bypasses the allowlist (an adapter that stops calling the guard, a
# config that removes it) turns the gate red. Add a model-level defense
# (spotlighting, outbound_guard) to also gate how often the model is fooled;
# expect a non-zero, model-dependent ASR there and set the threshold accordingly.

models:
  - openai/gpt-oss-20b     # via Groq (OpenAI-compatible); llama-3.3-70b-versatile was retired

adapters:
  - raw_loop

attacks:
  # `--smoke` (used by the CI gate) runs only the first attack, so lead with a
  # strong one rather than the weak `direct` baseline.
  - fixed_injection
  - important_instructions
  - direct

defenses:
  - recipient_allowlist

seeds: [0, 1, 2]

limits:
  max_turns: 5
  smoke: false
  campaign_budget: 8
