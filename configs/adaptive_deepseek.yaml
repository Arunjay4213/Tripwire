# First-pass baseline, adaptive attackers, model DeepSeek-V4-Pro: PAIR and TAP (this model carries the TAP slice).
# Run with ATTACKER_MODEL, GUARD_MODEL and READER_MODEL set to DeepSeek-V4-Pro (gpt-5.6-luna rejects a set temperature).
# Save the discovered payloads with --save-replay-library, then replay them on seeds 0..29 with --replay-library.
models: [DeepSeek-V4-Pro]
adapters: [raw_loop, multi_agent]   # langgraph dropped: the parity tests prove it sends raw_loop's exact requests; see configs/langgraph_sanity.yaml
scenarios: [invoice, helpdesk, calendar, expense]
attacks: [iterative, tree_attacker]
defenses: [null, prompt_hardening, spotlighting, outbound_guard]   # the rungs where search matters; the deterministic rungs block by construction
seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]   # discovery seeds, disjoint from the single-shot 0..29 so replay is held out
limits:
  max_tokens_per_run: 100000000   # hard stop; about 3x the estimate
  max_turns: 5
  campaign_budget: 8
  max_concurrency: 16
