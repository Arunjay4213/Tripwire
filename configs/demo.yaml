# Live-demo config for the pitch (docs/pitch-prep.md). Runs in about three minutes
# on the Azure DeepSeek deployment: one scenario, both adapters, the three attacks
# on the results slide, and three rungs of the ladder: undefended,
# prompt hardening (an instruction the model can be talked out of; it still
# leaks), and the recipient allowlist (a code check that holds).
models: [DeepSeek-V4-Pro]
adapters: [raw_loop, multi_agent]
scenarios: [invoice]
attacks: [metadata_exfil, mundane_redirect, prerequisite_mirror]
defenses: [null, prompt_hardening, recipient_allowlist]
seeds: [0, 1, 2]
limits:
  max_turns: 5
  max_concurrency: 8
