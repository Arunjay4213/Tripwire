[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI reserves the bare name "tripwire", so the distribution is "tripwire-eval".
# The import package and the CLI command are still `tripwire` (like
# scikit-learn -> import sklearn).
name = "tripwire-eval"
version = "0.1.0"
description = "Measure how vulnerable your AI agent is to prompt-injection attacks, across frameworks and defenses."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arunjay", email = "arunjay101@gmail.com" }]
keywords = [
    "prompt-injection",
    "ai-security",
    "agents",
    "llm",
    "red-team",
    "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

# Core install stays small: an OpenAI-compatible client, env loading, YAML config,
# and LangGraph for the langgraph/multi_agent adapters. The AgentDojo bridge and
# the analysis plots are opt-in extras below (agentdojo is heavy and only the
# bridge imports it; nothing on the CLI path does).
dependencies = [
    "openai>=2,<3",
    "python-dotenv>=1",
    "pyyaml>=6",
    "langgraph>=1",
    "langchain-core>=1",
]

[project.optional-dependencies]
agentdojo = ["agentdojo==0.1.35"]   # real AgentDojo suites for the bridge
viz = ["matplotlib>=3.8"]           # Pareto / analysis plots
dev = ["pytest>=9", "agentdojo==0.1.35", "matplotlib>=3.8"]
all = ["agentdojo==0.1.35", "matplotlib>=3.8"]

[project.scripts]
tripwire = "tripwire.__main__:main"

[project.urls]
Homepage = "https://github.com/Arunjay4213/Tripwire"
Repository = "https://github.com/Arunjay4213/Tripwire"
Issues = "https://github.com/Arunjay4213/Tripwire/issues"

[tool.hatch.build.targets.wheel]
# Ship only the importable package (not tests/, scripts/, spike/, examples/).
packages = ["tripwire"]

[tool.hatch.build.targets.sdist]
include = [
    "tripwire",
    "examples",
    "README.md",
    "LICENSE",
]
