# Threat model / run config (roadmap Weeks 4-5).
# Copy to threat_model.yaml and edit. Commit configs alongside results.

models:
  - llama-3.3-70b-versatile   # via Groq (OpenAI-compatible)

suites:
  - workspace

adapters:
  - raw_loop
  - langgraph

attacks:
  # single-shot templated attacks (deterministic, seed-reproducible)
  - direct
  - ignore_previous
  - system_message
  - injecagent
  - important_instructions
  - fixed_injection
  # adaptive attacker — runs a campaign per seed, not a single episode.
  # LLM-driven, so NOT seed-reproducible. Uses ATTACKER_MODEL (or GROQ_MODEL).
  - iterative

# Defense ladder, cheap-weak -> expensive-strong, so the security/utility
# Pareto has shape instead of collapsing to a single point. Each rung trades
# more runtime cost (and more utility risk) for more robustness:
#
#   null            baseline, no mitigation.
#   prompt_hardening L1. Appends "distrust tool content" to the system prompt.
#                    ~0 cost, ~0 utility loss, weak -- a good injection is
#                    written precisely to override such an instruction. Baseline
#                    instruction-defense from the prompt-injection literature.
#   spotlighting     L2. Fences untrusted tool output in delimiters and tells
#                    the model fenced text is data, not instructions. Still
#                    cheap (no extra model), structurally stronger than L1.
#                    Microsoft Spotlighting, Hines et al. 2024 (arXiv:2403.14720).
#   tool_filter      Removes the leak-capable tool from the menu entirely.
#                    Degenerate for a pure leak scenario -- drop send_email and
#                    utility goes to 0, keep it and the defense does nothing --
#                    kept as the illustrative "blunt instrument" reference point.
#   outbound_guard   L3. A second model inspects each send_email before it fires
#                    and blocks a detected secret leak. Strongest and most
#                    expensive (an extra model call per action; false positives
#                    cost utility). Dual-LLM / PromptGuard pattern.
defenses:
  - null
  - prompt_hardening
  - spotlighting
  - tool_filter
  - outbound_guard

# tool_filter's allowlist (required by tool_filter). Excluding send_email means
# the model is never even offered the leak-capable tool -- and check_tool_call
# blocks it even if the model free-forms the call anyway -- regardless of what
# the attack talks it into.
allowed_tools:
  - read_inbox

seeds: [0, 1, 2]

# hard cost controls (add now, roadmap Weeks 4-5)
limits:
  max_tokens_per_run: null
  smoke: false          # --smoke runs a tiny subset cheaply
  campaign_budget: 8    # max attempts per adaptive (iterative) campaign
